services:
  gozero:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ENABLE_LIVE: "1"
    volumes:
      - show-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  show-data:
